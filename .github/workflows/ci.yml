name: RAG unit checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check Python syntax
        run: python -m compileall -q src scripts
      - name: Test deterministic retrieval units
        run: python -m pytest tests/test_rrf.py tests/test_chunker.py -q --junitxml=unit-test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-unit-results
          path: unit-test-results.xml
          if-no-files-found: ignore
